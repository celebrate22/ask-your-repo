[project]
name = "askrepo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.100,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.24,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
